<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Local Forge chat, derived from Open WebUI v0.6.5" />
  <link rel="icon" href="/favicon.svg" />
  <script>
   try { const s = JSON.parse(localStorage.getItem('openwebui-forge.settings.v1') || '{}'); if (s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); } catch {}
  </script>
  %sveltekit.head%
 </head>
 <body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
